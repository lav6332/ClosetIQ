name: Build ClosetIQ Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Source Zip if present
        run: |
          if [ -f ClosetIQ-Source.zip ]; then
            echo "Extracting ClosetIQ-Source.zip..."
            unzip -o ClosetIQ-Source.zip
          fi

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClosetIQ-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
